<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dice God — Prototype 1</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0c0c10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 960px;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: default;
  }
</style>
</head>
<body>

<canvas id="game" width="960" height="540"></canvas>

<script>
"use strict";

// ---------------------------------------------------------------------
// CONFIG
// ---------------------------------------------------------------------
const NUM_DICE = 5;
const CASTS_PER_JUDGEMENT = 3;

// Target grows every Judgement instead of looping a fixed list
function targetForJudgement(i) { return 12 + i * 3; }

const SHAKE_MS       = 500;   // cup rattling before release
const TUMBLE_MS      = 420;   // dice spinning in the air
const STAGGER_MS     = 90;    // gap between each die landing
const ROLL_FRAME_MS  = 70;
const SETTLE_MS      = 160;   // squash/bounce after a die lands

const DIE_SPACING = 132;

// ---------------------------------------------------------------------
// ASSETS
// ---------------------------------------------------------------------
const IMG_PATHS = {
  faceOne:   "art/sprites/dice/faces/Die-One.png",
  faceTwo:   "art/sprites/dice/faces/Die-Two.png",
  faceThree: "art/sprites/dice/faces/Die-Three.png",
  faceFour:  "art/sprites/dice/faces/Die-Four.png",
  faceFive:  "art/sprites/dice/faces/Die-Five.png",
  faceSix:   "art/sprites/dice/faces/Die-Six.png",

  rollOne:   "art/sprites/dice/corners/rolling-one.png",
  rollTwo:   "art/sprites/dice/corners/rolling-two.png",
  rollThree: "art/sprites/dice/corners/rolling-three.png",

  outline:   "art/sprites/dice/Die-Outline.png",
  shadow:    "art/sprites/dice/Dice-Shadow.png",
  cup:       "art/sprites/misc/Dice-Cup.png",

  throwBtn:  "art/sprites/ui/throw-button.png",
  rerollBtn: "art/sprites/ui/reroll-button.png",
  pipEmpty:  "art/sprites/ui/cast-pip-empty.png",
  pipFull:   "art/sprites/ui/cast-pip-full.png",
  fatePanel: "art/sprites/ui/fate-panel-blank.png",
  background:"art/sprites/ui/background.png"
};

const SFX_PATHS = {
  cupShake:     "sfx/cup_shake.wav",
  cupThrow:     "sfx/cup_throw.wav",
  diceLand1:    "sfx/dice_land_1.wav",
  diceLand2:    "sfx/dice_land_2.wav",
  diceLand3:    "sfx/dice_land_3.wav",
  uiClick:      "sfx/ui_click.wav",
  holdToggle:   "sfx/hold_toggle.wav",
  rerollWhoosh: "sfx/reroll_whoosh.wav",
  fateSuccess:  "sfx/fate_success.wav",
  fateFail:     "sfx/fate_fail.wav",
  judgementAdv: "sfx/next_level.mp3"
};

const MUSIC_PATH = "music/music_loop.m4a";

const images = {};
const sounds = {};
let music = null;

function loadImage(key, path) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload  = () => { images[key] = img; resolve(); };
    img.onerror = () => { images[key] = null; console.warn("Missing image:", path); resolve(); };
    img.src = path;
  });
}

function loadSound(key, path) {
  const a = new Audio(path);
  a.preload = "auto";
  a.onerror = () => console.warn("Missing sound:", path);
  sounds[key] = a;
}

function playSfx(key, volume) {
  const src = sounds[key];
  if (!src) return null;
  const clone = src.cloneNode();
  clone.volume = volume === undefined ? 1 : volume;
  clone.play().catch(() => {});
  return clone;
}

function randomLandSfx() {
  return ["diceLand1", "diceLand2", "diceLand3"][Math.floor(Math.random() * 3)];
}

// ---------------------------------------------------------------------
// DRAWING HELPERS — everything uses native sprite size * integer scale,
// so nothing ever stretches or distorts.
// ---------------------------------------------------------------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

// Target on-screen sizes (height in px). Scale is derived from each file's
// ACTUAL dimensions, so art can be exported at any resolution and still fit.
const FIT = {
  die:       96,
  cup:      140,
  fatePanel: 72,
  button:    56,
  pip:       28,
  shadow:    18
};

const FIT_FOR = {
  faceOne: FIT.die, faceTwo: FIT.die, faceThree: FIT.die,
  faceFour: FIT.die, faceFive: FIT.die, faceSix: FIT.die,
  rollOne: FIT.die, rollTwo: FIT.die, rollThree: FIT.die,
  outline: FIT.die,
  shadow: FIT.shadow,
  cup: FIT.cup,
  fatePanel: FIT.fatePanel,
  throwBtn: FIT.button, rerollBtn: FIT.button,
  pipEmpty: FIT.pip, pipFull: FIT.pip
};

function spriteSize(key) {
  const img = images[key];
  const targetH = FIT_FOR[key] || 64;
  if (!img) return { w: targetH, h: targetH };
  const scale = targetH / img.naturalHeight;
  return { w: img.naturalWidth * scale, h: targetH };
}

// Draws centered on (cx, cy), scaled to its target size, aspect preserved.
function drawSprite(key, cx, cy, opts) {
  const o = opts || {};
  const img = images[key];
  const size = spriteSize(key);
  const w = size.w * (o.scaleX === undefined ? 1 : o.scaleX);
  const h = size.h * (o.scaleY === undefined ? 1 : o.scaleY);
  const x = Math.round(cx - w / 2);
  const y = Math.round(cy - h / 2);

  if (o.alpha !== undefined) { ctx.save(); ctx.globalAlpha = o.alpha; }

  if (img) {
    ctx.drawImage(img, x, y, Math.round(w), Math.round(h));
  } else {
    ctx.fillStyle = "#c800c8";
    ctx.fillRect(x, y, Math.round(w), Math.round(h));
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(x, y, Math.round(w), Math.round(h));
  }

  if (o.alpha !== undefined) ctx.restore();
}

function drawBackground() {
  const img = images.background;
  if (!img) { ctx.fillStyle = "#0d1f22"; ctx.fillRect(0, 0, canvas.width, canvas.height); return; }
  // Cover the canvas without distorting aspect ratio
  const scale = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
  const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
  ctx.drawImage(img, Math.round((canvas.width - w) / 2), Math.round((canvas.height - h) / 2),
                Math.round(w), Math.round(h));
}

function text(str, x, y, size, colour, align) {
  ctx.fillStyle = colour || "#f4ecd8";
  ctx.font = size + "px monospace";
  ctx.textAlign = align || "center";
  ctx.textBaseline = "middle";
  ctx.fillText(str, x, y);
}

// ---------------------------------------------------------------------
// LAYOUT
// ---------------------------------------------------------------------
const LAYOUT = {
  judgementY: 40,
  fateY:      100,
  cupY:       205,
  diceY:      340,
  pipsY:      432,
  buttonY:    490
};

// ---------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------
const PHASE = { READY: "ready", SHAKING: "shaking", TUMBLING: "tumbling", RESOLVED: "resolved", OUTCOME: "outcome" };

let dice = [];
let judgementIndex = 0;
let castsRemaining = CASTS_PER_JUDGEMENT;
let hasThrownThisRound = false;
let phase = PHASE.READY;
let phaseStart = 0;
let outcomeText = "";
let outcomeColour = "#f4ecd8";
let hoveredDie = -1;
let hoveringButton = false;
let shakeSfxHandle = null;

function initDice() {
  dice = [];
  const totalWidth = (NUM_DICE - 1) * DIE_SPACING;
  const startX = canvas.width / 2 - totalWidth / 2;
  for (let i = 0; i < NUM_DICE; i++) {
    dice.push({
      value: 1,
      held: false,
      revealed: false,   // false = still in the cup / mid-air
      x: startX + i * DIE_SPACING,
      landAt: 0,         // timestamp this die settles
      pending: 1
    });
  }
}

const currentTarget = () => targetForJudgement(judgementIndex);
const currentSum = () => dice.reduce((s, d) => s + (d.revealed ? d.value : 0), 0);
const canThrow = () => (phase === PHASE.READY || phase === PHASE.RESOLVED) && castsRemaining > 0;

// ---------------------------------------------------------------------
// THROW SEQUENCE
// ---------------------------------------------------------------------
function startThrow() {
  if (!canThrow()) return;

  const isReroll = hasThrownThisRound;
  playSfx("uiClick");
  if (isReroll) playSfx("rerollWhoosh");

  phase = PHASE.SHAKING;
  phaseStart = performance.now();
  shakeSfxHandle = playSfx("cupShake");

  // Unheld dice go back in the cup
  dice.forEach(d => { if (!d.held) d.revealed = false; });

  setTimeout(releaseDice, SHAKE_MS);
}

function releaseDice() {
  if (shakeSfxHandle) { try { shakeSfxHandle.pause(); } catch (e) {} shakeSfxHandle = null; }
  playSfx("cupThrow");

  phase = PHASE.TUMBLING;
  phaseStart = performance.now();

  // Roll results decided now; the animation is just the reveal
  let stagger = 0;
  dice.forEach(d => {
    if (d.held) return;
    d.pending = 1 + Math.floor(Math.random() * 6);
    d.landAt = phaseStart + TUMBLE_MS + stagger;
    stagger += STAGGER_MS;
  });

  const lastLand = TUMBLE_MS + Math.max(0, stagger - STAGGER_MS);
  setTimeout(resolveThrow, lastLand + 120);
}

function resolveThrow() {
  phase = PHASE.RESOLVED;
  castsRemaining--;
  checkOutcome();
}

function checkOutcome() {
  const sum = currentSum();
  const target = currentTarget();

  if (sum >= target) {
    phase = PHASE.OUTCOME;
    outcomeText = "FATE FULFILLED";
    outcomeColour = "#9ae6a0";
    playSfx("fateSuccess");
    setTimeout(advanceJudgement, 1200);
  } else if (castsRemaining <= 0) {
    phase = PHASE.OUTCOME;
    outcomeText = "FATE DENIED";
    outcomeColour = "#e88b8b";
    playSfx("fateFail");
    // Failing retries the SAME Judgement rather than advancing it.
    // TODO: decide real fail behaviour — lives? run ends? for now, retry.
    setTimeout(retryJudgement, 1200);
  }
}

function resetRound() {
  castsRemaining = CASTS_PER_JUDGEMENT;
  hasThrownThisRound = false;
  outcomeText = "";
  dice.forEach(d => { d.held = false; d.revealed = false; });
  phase = PHASE.READY;
}

function advanceJudgement() {
  playSfx("judgementAdv");
  judgementIndex++;
  resetRound();
}

function retryJudgement() {
  resetRound();
}

// ---------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}

function buttonRect() {
  const key = hasThrownThisRound ? "rerollBtn" : "throwBtn";
  const size = spriteSize(key);
  return { x: canvas.width / 2 - size.w / 2, y: LAYOUT.buttonY - size.h / 2, w: size.w, h: size.h };
}

function dieRect(d) {
  const size = spriteSize("faceOne");
  const y = LAYOUT.diceY - (d.held ? 10 : 0);
  return { x: d.x - size.w / 2, y: y - size.h / 2, w: size.w, h: size.h };
}

function hit(p, r) { return p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h; }

const diceInteractive = () => (phase === PHASE.RESOLVED) && hasThrownThisRound;

canvas.addEventListener("mousemove", (e) => {
  const p = canvasPos(e);
  hoveringButton = canThrow() && hit(p, buttonRect());
  hoveredDie = -1;
  if (diceInteractive()) {
    dice.forEach((d, i) => { if (d.revealed && hit(p, dieRect(d))) hoveredDie = i; });
  }
  canvas.style.cursor = (hoveringButton || hoveredDie >= 0) ? "pointer" : "default";
});

canvas.addEventListener("click", (e) => {
  const p = canvasPos(e);

  if (canThrow() && hit(p, buttonRect())) {
    hasThrownThisRound = true;
    startThrow();
    return;
  }

  if (!diceInteractive()) return;
  for (const d of dice) {
    if (d.revealed && hit(p, dieRect(d))) {
      d.held = !d.held;
      playSfx("holdToggle");
      break;
    }
  }
});

// ---------------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------------
const FACE_KEYS = ["faceOne","faceTwo","faceThree","faceFour","faceFive","faceSix"];
const ROLL_KEYS = ["rollOne","rollTwo","rollThree"];

function draw() {
  const now = performance.now();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();

  // --- Judgement title (drawn in-canvas so it can't overlap the panel) ---
  // TODO: swap this text for the judgement banner sprite when you make one.
  text("JUDGEMENT " + (judgementIndex + 1), canvas.width / 2, LAYOUT.judgementY, 22, "#ffcf6b");

  // --- Fate panel ---
  drawSprite("fatePanel", canvas.width / 2, LAYOUT.fateY);
  const sum = currentSum(), target = currentTarget();
  const reached = sum >= target;
  text(sum + " / " + target, canvas.width / 2, LAYOUT.fateY, 30, reached ? "#9ae6a0" : "#2a2018");

  // --- Cup (wiggles while shaking, no extra art needed) ---
  let cupX = canvas.width / 2, cupY = LAYOUT.cupY;
  if (phase === PHASE.SHAKING) {
    const t = now - phaseStart;
    cupX += Math.sin(t / 32) * 9;
    cupY += Math.sin(t / 19) * 5;
  } else if (phase === PHASE.TUMBLING && now - phaseStart < 160) {
    cupY -= 10; // little kick on release
  }
  drawSprite("cup", cupX, cupY);

  // --- Dice ---
  dice.forEach((d, i) => {
    // Reveal staggered landings
    if (phase === PHASE.TUMBLING && !d.held && !d.revealed && now >= d.landAt) {
      d.value = d.pending;
      d.revealed = true;
      playSfx(randomLandSfx(), 0.9);
    }

    const inAir = (phase === PHASE.SHAKING || phase === PHASE.TUMBLING) && !d.held && !d.revealed;
    if (!d.revealed && !inAir) return; // still in the cup, draw nothing

    const y = LAYOUT.diceY - (d.held ? 10 : 0);

    if (inAir) {
      // Tumbling above the table, falling toward the slot
      const timeLeft = Math.max(0, d.landAt - now);
      const lift = Math.min(120, timeLeft * 0.55);
      const frame = Math.floor(now / ROLL_FRAME_MS + i) % ROLL_KEYS.length;
      drawSprite("shadow", d.x, y + FIT.die / 2 - 4, { alpha: 0.25 });
      drawSprite(ROLL_KEYS[frame], d.x, y - lift);
      return;
    }

    // Settle squash right after landing
    let sx = 1, sy = 1;
    const since = now - d.landAt;
    if (d.revealed && since >= 0 && since < SETTLE_MS) {
      const k = 1 - since / SETTLE_MS;
      sx = 1 + 0.16 * k;
      sy = 1 - 0.16 * k;
    }

    drawSprite("shadow", d.x, y + FIT.die / 2 - 4, { alpha: d.held ? 0.7 : 0.45 });
    drawSprite(FACE_KEYS[d.value - 1], d.x, y, { scaleX: sx, scaleY: sy });

    if (d.held) {
      drawSprite("outline", d.x, y);
    } else if (hoveredDie === i) {
      drawSprite("outline", d.x, y, { alpha: 0.45 });
    }
  });

  // --- Cast pips ---
  const pipSize = spriteSize("pipEmpty");
  const gap = 12;
  const totalW = CASTS_PER_JUDGEMENT * pipSize.w + (CASTS_PER_JUDGEMENT - 1) * gap;
  let px = canvas.width / 2 - totalW / 2 + pipSize.w / 2;
  for (let i = 0; i < CASTS_PER_JUDGEMENT; i++) {
    drawSprite(i < castsRemaining ? "pipFull" : "pipEmpty", px, LAYOUT.pipsY);
    px += pipSize.w + gap;
  }

  // --- Button ---
  if (phase === PHASE.OUTCOME) {
    text(outcomeText, canvas.width / 2, LAYOUT.buttonY, 30, outcomeColour);
  } else {
    const key = hasThrownThisRound ? "rerollBtn" : "throwBtn";
    const enabled = canThrow();
    drawSprite(key, canvas.width / 2, LAYOUT.buttonY - (hoveringButton ? 3 : 0),
               { alpha: enabled ? 1 : 0.4 });
  }

  requestAnimationFrame(draw);
}

// ---------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------
async function boot() {
  await Promise.all(Object.entries(IMG_PATHS).map(([k, p]) => loadImage(k, p)));
  Object.entries(SFX_PATHS).forEach(([k, p]) => loadSound(k, p));

  music = new Audio(MUSIC_PATH);
  music.loop = true;
  music.volume = 0.4;

  // Debug: logs the real dimensions of every loaded sprite. Handy if
  // something looks the wrong size — check this against FIT above.
  console.table(Object.keys(IMG_PATHS).map(k => ({
    sprite: k,
    file: images[k] ? images[k].naturalWidth + "x" + images[k].naturalHeight : "MISSING",
    drawnAt: images[k] ? Math.round(spriteSize(k).w) + "x" + Math.round(spriteSize(k).h) : "-"
  })));

  initDice();
  document.addEventListener("click", () => { music.play().catch(() => {}); }, { once: true });
  requestAnimationFrame(draw);
}

boot();
</script>

</body>
</html>
